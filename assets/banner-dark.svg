<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Rishabh Mehta, cloud and data engineer">
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="rgba(238,237,232,0.07)"/></pattern>
    <clipPath id="r"><rect width="1200" height="360" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="360" fill="#0e0e0d"/>
    <rect width="1200" height="360" fill="url(#dots)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="14" fill="none" stroke="#2a2a28"/>

  <rect x="56" y="54" width="12" height="12" rx="1.5" fill="#9b85f5"/>
  <text x="80" y="65" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="500" fill="#eeede8">fin1te</text>
  <text x="1144" y="65" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#94928b">Mumbai · UTC+5:30</text>

  <text x="56" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.6" fill="#eeede8">Rishabh Mehta</text>
  <text x="56" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#c9c8c1">Cloud &amp; Data Engineer at Jio Platforms. I build data platforms and</text>
  <text x="56" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#c9c8c1">cloud infrastructure, <tspan fill="#b8a7ff" font-weight="600">then make them smaller.</tspan></text>

  <line x1="56" y1="258" x2="1144" y2="258" stroke="#2a2a28"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="56" y="298" font-size="24" font-weight="700"><tspan fill="#65645f" text-decoration="line-through">8.7 TB</tspan><tspan fill="#9b85f5" dx="10">→</tspan><tspan fill="#eeede8" dx="10">&lt;200 GB</tspan></text>
    <text x="56" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#94928b">RAM after Spark → Rust, 17 groups</text>

    <text x="340" y="298" font-size="24" font-weight="700" fill="#eeede8">400+</text>
    <text x="340" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#94928b">Spark jobs on Structured Streaming</text>

    <text x="630" y="298" font-size="24" font-weight="700" fill="#eeede8">200+ PB</text>
    <text x="630" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#94928b">ClickHouse, 2T+ row tables</text>

    <text x="880" y="298" font-size="24" font-weight="700" fill="#eeede8">AI datacenter</text>
    <text x="880" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#94928b">cloud + network, from scratch</text>
  </g>
